name: film-bot

x-app-environment: &app-environment
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: postgres://film_bot:${POSTGRES_PASSWORD}@postgres:5432/film_bot
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  BOT_TOKEN: ${BOT_TOKEN}
  BOT_USERNAME: ${BOT_USERNAME}
  ADMIN_TELEGRAM_USER_ID: ${ADMIN_TELEGRAM_USER_ID:-}
  TELEGRAM_STORAGE_CHAT_ID: ${TELEGRAM_STORAGE_CHAT_ID}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
  SESSION_SECRET: ${SESSION_SECRET}
  MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET}
  TELEGRAM_INIT_DATA_TTL_SECONDS: ${TELEGRAM_INIT_DATA_TTL_SECONDS:-900}
  USER_SESSION_TTL_SECONDS: ${USER_SESSION_TTL_SECONDS:-3600}
  ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-7200}
  REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1000}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
  RATE_LIMIT_AUTH_MAX_REQUESTS: ${RATE_LIMIT_AUTH_MAX_REQUESTS:-20}
  RATE_LIMIT_ADMIN_MAX_REQUESTS: ${RATE_LIMIT_ADMIN_MAX_REQUESTS:-240}
  RATE_LIMIT_MEDIA_MAX_REQUESTS: ${RATE_LIMIT_MEDIA_MAX_REQUESTS:-180}
  MEDIA_UPSTREAM_TIMEOUT_MS: ${MEDIA_UPSTREAM_TIMEOUT_MS:-15000}
  MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-10000000}
  BOT_USE_WEBHOOK: ${BOT_USE_WEBHOOK:-true}
  MINI_APP_URL: https://${MINI_APP_DOMAIN}
  ADMIN_APP_URL: https://${ADMIN_APP_DOMAIN}
  PUBLIC_API_URL: https://${API_DOMAIN}
  API_PORT: 3000
  BOT_WORKER_PORT: 3001

services:
  caddy:
    image: ${IMAGE_PREFIX:-film-bot}/web:${RELEASE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      MINI_APP_DOMAIN: ${MINI_APP_DOMAIN}
      ADMIN_APP_DOMAIN: ${ADMIN_APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      bot-worker:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  api:
    image: ${IMAGE_PREFIX:-film-bot}/api:${RELEASE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    restart: unless-stopped
    environment: *app-environment
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  bot-worker:
    image: ${IMAGE_PREFIX:-film-bot}/bot-worker:${RELEASE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: bot-worker
    restart: unless-stopped
    environment: *app-environment
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${IMAGE_PREFIX:-film-bot}/migrate:${RELEASE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: migrate
    restart: "no"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://film_bot:${POSTGRES_PASSWORD}@postgres:5432/film_bot
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: film_bot
      POSTGRES_USER: film_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U film_bot -d film_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
