name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f infra/compose/compose.yml config --quiet
      - run: docker build --target api -t film-bot-api:ci -f infra/docker/Dockerfile .
      - run: docker build --target bot-worker -t film-bot-worker:ci -f infra/docker/Dockerfile .
      - run: docker build --target migrate -t film-bot-migrate:ci -f infra/docker/Dockerfile .
      - run: docker build --target web -t film-bot-web:ci -f infra/docker/Dockerfile .
